# Phase 2: Stabilization config
# Build on Phase 1 gains with larger batches, fewer update epochs, and LR decay

# Environment
k_hop: 2
reward_metric: "gcc"
dynamics: "static"
max_nodes: 1000

# Model
node_feat_dim: 7
hidden_dim: 64
gat_layers: 2
gat_heads: 4
gru_hidden: 128
action_dim: 32
dropout: 0.1

# Training
lr: 0.0001
gamma: 0.99
gae_lambda: 0.92       # Reduced from 0.95 for lower advantage variance
p_clip: 0.1
entropy_coef: 0.03
value_coef: 1.0
max_grad_norm: 0.5

update_steps: 8192
batch_size: 128        # Doubled for more stable gradients
update_epochs: 2       # Halved to reduce overfitting on small batch

n_training_graphs: 1000
n_nodes_range: [20, 120]
attack_budget_ratio: 0.2

# Evaluation during training
eval_interval: 10
n_eval_graphs: 20

# Checkpointing
save_dir: "checkpoints"
